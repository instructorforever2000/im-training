<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--tq:#1FB5A8;--royal:#1F2E7A;--navy:#042142;--bg:#030d18;--line:#ffffff14;--txt:#e7f4f3;--mut:#9fb3bd;--acc:#1FB5A8}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans Arabic','Outfit',sans-serif;min-height:100%}
.en{font-family:Outfit;color:var(--mut);font-weight:400;font-size:.82em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(900px 600px at 65% -10%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 70%),radial-gradient(800px 500px at 0% 100%,#1f2e7a33,transparent 70%);pointer-events:none;transition:background .8s}
.app{position:relative;display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto auto 1fr auto;gap:16px;padding:18px 22px;min-height:100dvh;max-width:1600px;margin:auto}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand img{width:36px;border-radius:9px}.brand b{color:var(--tq)}
.badge{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--mut)}
.sports{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.sports button{padding:8px 14px;border-radius:99px;background:#ffffff0a;border:1px solid var(--line);font-size:13.5px;transition:.25s}
.sports button.on{background:var(--acc);color:#04121c;font-weight:700;border-color:transparent;box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 20%,transparent)}
/* AI bar */
.ai{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 16%,#0b1a28),#0b1a28);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.orb{width:34px;height:34px;border-radius:50%;flex:none;background:conic-gradient(from 0deg,var(--acc),#5b7bff,var(--acc));animation:spin 4s linear infinite;mask:radial-gradient(circle,transparent 9px,#000 10px)}
@keyframes spin{to{transform:rotate(360deg)}}
.ai p{flex:1;font-size:15px;line-height:1.6}.ai p small{display:block;color:var(--mut);font-size:12px}
.ai .act{display:flex;gap:8px}.ai .act button{padding:8px 14px;border-radius:12px;font-size:13px;background:#ffffff12}.ai .act button.y{background:var(--acc);color:#04121c;font-weight:700}
/* arena */
.stage{position:relative;border-radius:24px;background:#06131f;border:1px solid var(--line);overflow:hidden;min-height:440px;perspective:1100px;touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.plane{position:absolute;inset:8% 6% 12%;transform-style:preserve-3d;transition:transform .15s}
.plane svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 30px 40px #000a)}
.hud{position:absolute;top:14px;right:14px;left:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.chip{background:#030d18cc;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:12.5px;pointer-events:auto}
.chip b{display:block;font-size:15px;color:var(--txt)}
.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--mut);background:#030d18aa;padding:5px 12px;border-radius:99px}
.views{position:absolute;bottom:12px;right:14px;display:flex;gap:6px}.views button{font-size:12px;padding:6px 10px;border-radius:10px;background:#030d18cc;border:1px solid var(--line)}
/* side */
aside{grid-row:3/5;grid-column:2;display:flex;flex-direction:column;gap:12px}
.card{background:#ffffff07;border:1px solid var(--line);border-radius:18px;padding:16px}
.card h4{font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:4px;background:#ffffff08;border-radius:12px;padding:4px;margin-bottom:12px}.tabs button{flex:1;font-size:12.5px;padding:7px 4px;border-radius:9px;color:var(--mut)}.tabs button.on{background:#ffffff14;color:var(--txt);font-weight:600}
.list div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff0b;font-size:13px}.list div span:last-child{color:var(--mut);font-size:12px;text-align:left}
.radar{width:100%;height:210px}
/* timeline */
.tl{grid-column:1;padding:14px 18px;border-radius:18px;background:#ffffff07;border:1px solid var(--line)}
.tl .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px}
.seg{display:flex;gap:5px;height:40px}.seg div{border-radius:10px;font-size:11.5px;padding:6px 9px;display:flex;align-items:center;cursor:pointer;transition:.3s;white-space:nowrap;overflow:hidden}
.seg div.on{outline:2px solid var(--acc);outline-offset:2px}
input[type=range]{width:100%;margin-top:10px;accent-color:var(--acc)}
.fade{animation:fade .5s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.proto{position:fixed;bottom:10px;left:12px;font-size:11px;color:var(--mut);opacity:.7}
@media (max-width:980px){html,body{overflow-x:hidden}.app>*{min-width:0}.hint{display:none}.proto{position:static;display:block;text-align:center;padding:10px}.app{grid-template-columns:1fr;padding:12px}aside{grid-column:1;grid-row:auto}.tl{grid-column:1}.stage{min-height:340px}.ai{flex-wrap:wrap}.sports{margin:0;overflow-x:auto;flex-wrap:nowrap;width:100%}.sports button{white-space:nowrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

  g+=`<path d="${st(R0)}" fill="#166534"/><line x1="${500+L}" y1="${280-R0-160}" x2="${500+L}" y2="${280-R0}" stroke="#fff" stroke-width="4"/>`;
  for(let i=0;i<6;i++){g+=`<circle r="9" fill="${i==2?c:'#fff'}" stroke="#04121c" stroke-width="3"><animateMotion dur="${6+i*.3}s" repeatCount="indefinite" path="${st(R0+30+i*20)}"/></circle>`}}
 if(k==='basketball'){g=`<rect width="${W}" height="${H}" rx="14" fill="#c2814a"/>${[...Array(20)].map((_,i)=>`<rect x="${i*50}" width="25" height="${H}" fill="#b8763f" opacity=".5"/>`).join('')}<g stroke="#fff" stroke-width="4" fill="none"><rect x="20" y="20" width="960" height="520"/><line x1="500" y1="20" x2="500" y2="540"/><circle cx="500" cy="280" r="60"/><rect x="20" y="200" width="190" height="160"/><rect x="790" y="200" width="190" height="160"/><path d="M20 55 H90 A240 240 0 0 1 90 505 H20"/><path d="M980 55 H910 A240 240 0 0 0 910 505 H980"/></g><circle cx="60" cy="280" r="14" fill="none" stroke="#f97316" stroke-width="5"/><circle cx="940" cy="280" r="14" fill="none" stroke="#f97316" stroke-width="5"/>`;
  g+=dots([[620,300],[720,200],[760,400],[560,150],[820,300]],'#1F2E7A',[1,2,3,4,5])+path('M620 300 Q700 260 720 200','#fff')+path('M720 200 Q850 230 930 280',c)+`<circle r="12" fill="#f97316" stroke="#000" stroke-width="2"><animateMotion dur="2.2s" repeatCount="indefinite" path="M620 300 Q700 260 720 200 Q850 230 930 280"/></circle>`;}
 return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function path(d,col='#fde047'){return `<path d="${d}" fill="none" stroke="${col}" stroke-width="4" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" from="44" to="0" dur="1s" repeatCount="indefinite"/></path>`}
function dots(a,col,lab=[]){return a.map((p,i)=>`<g><circle cx="${p[0]}" cy="${p[1]}" r="22" fill="${col}" stroke="#04121c" stroke-width="3"><animate attributeName="r" values="22;24;22" dur="${2+i*.3}s" repeatCount="indefinite"/></circle>${lab[i]!==undefined?`<text x="${p[0]}" y="${p[1]+6}" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="17" fill="#04121c">${lab[i]}</text>`:''}</g>`).join('')}
function ball(x,y,d){return `<circle r="9" fill="#fff" stroke="#000" stroke-width="2"><animateMotion dur="3s" repeatCount="indefinite" path="${d}"/></circle>`}
function radar(f,c){const k=Object.keys(f),n=k.length,R=80;let s='';
 for(let l=1;l<=4;l++){s+=`<polygon points="${k.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [Math.cos(a)*R*l/4,Math.sin(a)*R*l/4].join(',')}).join(' ')}" fill="none" stroke="#ffffff14"/>`}
 const pts=k.map((key,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [Math.cos(a)*R*f[key],Math.sin(a)*R*f[key]]});
 s+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${c}33" stroke="${c}" stroke-width="2.5" class="fade"/>`;
 k.forEach((key,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;s+=`<text x="${Math.cos(a)*(R+22)}" y="${Math.sin(a)*(R+22)+4}" text-anchor="middle" fill="#cfe3e1" font-size="11">${key}</text>`});
 return s}
function seg(){const s=S[cur];let w=0;$('seg').innerHTML=s.phases.map(p=>{const st=w+1,en=w+p[1];w=en;const on=+$('scrub').value>=st&&+$('scrub').value<=en;return `<div style="flex:${p[1]};background:${p[2]}" class="${on?'on':''}">${p[0]}</div>`}).join('');$('wk').textContent='الأسبوع '+$('scrub').value+' / 36'}
function setTab(){const s=S[cur];$('tabBody').innerHTML=s[tab].map(r=>`<div><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');$('tabBody').classList.remove('fade');void $('tabBody').offsetWidth;$('tabBody').classList.add('fade')}
function setAI(){const s=S[cur];$('aiText').innerHTML=`${s.ai[ai%2]}<small>المساعد الذكي · ${s.n} <span class="en">AI Coach</span></small>`}
function render(){const s=S[cur];document.documentElement.style.setProperty('--acc',s.c);
 document.querySelectorAll('#sports button').forEach(b=>b.classList.toggle('on',b.dataset.s===cur));
 $('plane').innerHTML=arena(cur,s.c);$('plane').classList.remove('fade');void $('plane').offsetWidth;$('plane').classList.add('fade');
 $('chipA').innerHTML=`${s.a[0]}<b>${s.a[1]}</b>`;$('chipB').innerHTML=`${s.b[0]}<b class="en" style="color:var(--txt);font-size:14px">${s.b[1]}</b>`;
 $('radar').innerHTML=radar(s.fit,s.c);setTab();setAI();seg()}
function rot(){$('plane').style.transform=`rotateX(${rx}deg) rotateZ(${rz}deg)`}
$('sports').onclick=e=>{const b=e.target.closest('button');if(b){cur=b.dataset.s;ai=0;render()}};
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));setTab()};
$('aiYes').onclick=()=>{$('aiText').innerHTML='✓ تم التنفيذ — حُدّثت خطة اليوم.<small>يمكنك التراجع من سجل التغييرات</small>';setTimeout(()=>{ai++;setAI()},2200)};
$('aiNo').onclick=()=>{ai++;setAI()};
$('scrub').oninput=seg;
document.querySelector('.views').onclick=e=>{const v=e.target.dataset.v;if(!v)return;({top:()=>{rx=0;rz=0},tilt:()=>{rx=48;rz=0},low:()=>{rx=66;rz=-18}})[v]();$('plane').style.transition='transform .6s';rot();setTimeout(()=>$('plane').style.transition='transform .15s',600)};
let drag=null;$('stage').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag=[e.clientX,e.clientY,rx,rz];$('stage').setPointerCapture(e.pointerId)});
$('stage').addEventListener('pointermove',e=>{if(!drag)return;rz=drag[3]+(e.clientX-drag[0])*.3;rx=Math.max(0,Math.min(70,drag[2]-(e.clientY-drag[1])*.25));rot()});
$('stage').addEventListener('pointerup',()=>drag=null);
render();rot();
</script></body></html>
